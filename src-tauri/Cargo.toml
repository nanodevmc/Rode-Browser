[package]
name = "nanobrowser"
version = "1.0.4"
description = "Fast Liquid Glass Modern Browser"
authors = ["NanoDev"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "nanobrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
cc = "1.2"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-log = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
