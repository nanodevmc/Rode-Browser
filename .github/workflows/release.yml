name: Release Rode Browser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Bundle Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Rode Browser v__VERSION__'
          releaseBody: |
            ## 🚀 Rode Browser Release v__VERSION__
            
            - **Super fast and ultra lightweight** desktop browser built with Tauri v2.
            - **Cross-platform**: Windows (.exe installer) & Linux (.deb / AppImage).
            - **Ultra-low CPU usage (< 5%)** and instant tab hibernation.
            - Native C++ integration for Win32 default browser registration.
            - Built-in AdBlock & speed dial new tab screen.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
