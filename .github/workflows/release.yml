name: Release Rode Browser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Bundle Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Rode Browser v__VERSION__'
          releaseBody: |
            ## 🚀 Rode Browser Release v__VERSION__
            
            - **Super fast and ultra lightweight** desktop browser built with Tauri v2 + Win32 C++ FFI.
            - **Native Chromium (WebView2)** rendering: 100% web standards support without iframe restrictions.
            - **Ultra-low CPU usage (< 5%)** and instant tab hibernation.
            - **Native C++ module** for Windows default browser registration.
            - Built-in AdBlock & speed dial new tab screen.
          releaseDraft: false
          prerelease: false
